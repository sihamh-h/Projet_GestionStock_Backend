spring.application.name=GestionStock
spring.datasource.url=jdbc:mysql://127.0.0.1:3309/db_gestion_stock?useSSL=false&&serverTimezone=UTC
spring.datasource.username=${Mysql_name}
spring.datasource.password=${Mysql_Pwd}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
server.port=8080
spring.jpa.open-in-view=false
spring.security.user.name=${spring_name}
spring.security.user.password=${spring_Pwd}
spring.jackson.date-format=dd-MM-yyyy
spring.jackson.time-zone=Europe/Zagreb

app.security.password-encoder=argon2

app.jwt.secret=${JWT_ACTIVATION_SECRET}
app.jwt.expiration=86400000      # 24h en millisecondes
app.jwt.refresh-expiration=604800000  # 7 jours
app.jwt.activation-expiration=172800000  # ACTIVATION token - 48h
app.jwt.reset-expiration=3600000 # PASSWORD_RESET token - 1h

app.jwt.tokens.ACCESS=86400000
app.jwt.tokens.REFRESH=604800000
app.jwt.tokens.ACTIVATION=172800000
app.jwt.tokens.PASSWORD_RESET=3600000

# Configuration SMTP
# ==================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail_name}
spring.mail.password=${mail_Pwd}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Propriété personnalisée pour le nom d'affichage
app.mail.from-name=Gestion Stock Support



