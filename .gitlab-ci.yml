stages:
  - test
  - build

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository

test:
  stage: test
  image: eclipse-temurin:17-jdk-alpine
  script:
    - chmod +x ./mvnw
    - ./mvnw test
    - ./mvnw test -Dfile.encoding=UTF-8
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml



build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t stockiflow-backend:$CI_COMMIT_SHORT_SHA .
  only:
    - main